  :root{
    --bg:#000000;
    --card:#1C1C1E;
    --card2:#2C2C2E;
    --card3:#3A3A3C;
    --sep:rgba(84,84,88,0.48);
    --label:#FFFFFF;
    --label2:rgba(235,235,245,0.6);
    --label3:rgba(235,235,245,0.3);
    --accent:#0A84FF;
    --accent-bright:#409CFF;
    --accent-dim:rgba(10,132,255,0.16);
    --success:#30D158;
    --danger:#FF453A;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html, body{overflow-x:hidden; width:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 18% -8%, rgba(10,132,255,0.14), transparent 42%),
      radial-gradient(circle at 100% 105%, rgba(10,132,255,0.08), transparent 48%),
      var(--bg);
    color:var(--label);
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
    min-height:100vh;
    min-height:100dvh;
    padding:calc(22px + var(--safe-top)) 16px calc(32px + var(--safe-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:600px; margin:0 auto;}

  /* Large-title nav header, iOS style */
  header{margin-bottom:22px;}
  .nav-title-row{
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  }
  .large-title{
    margin:0;
    font-size:30px; font-weight:700; letter-spacing:-0.4px; line-height:1.15;
  }
  .large-title .accent{color:var(--accent-bright);}
  .subtitle{margin:4px 0 0; color:var(--label2); font-size:13.5px; font-weight:400;}
  .update-line{margin:10px 0 0; color:var(--label3); font-size:11.5px; font-family:'IBM Plex Mono', monospace;}

  .count-badge{
    font-family:'IBM Plex Mono', monospace;
    background:var(--accent-dim);
    color:var(--accent-bright); font-size:12px; font-weight:600;
    padding:7px 12px; border-radius:100px;
    white-space:nowrap;
    flex-shrink:0;
    margin-top:2px;
  }

  .section-label{
    display:flex; align-items:center; gap:6px;
    color:var(--label2); font-size:12.5px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.4px;
    margin:0 4px 8px;
  }
  .section-label svg{color:var(--label3); flex-shrink:0;}

  /* Card container, grouped-list style */
  .card{
    background:var(--card);
    border-radius:20px;
    box-shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 16px 34px rgba(0,0,0,0.45);
    overflow:hidden;
  }
  .compose-card{padding:14px;}

  .code-row{display:flex; gap:10px; align-items:center;}
  #codeInput{
    flex:1;
    min-width:0;
    font-family:'IBM Plex Mono', monospace;
    font-size:22px; font-weight:600;
    background:var(--card2);
    border:1px solid transparent;
    border-radius:14px;
    color:var(--label);
    text-align:center;
    padding:14px 10px;
    letter-spacing:1.5px;
    outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
    -webkit-appearance:none;
  }
  #codeInput:focus{border-color:var(--accent); background:var(--card3); box-shadow:0 0 0 4px var(--accent-dim);}
  #codeInput::placeholder{color:var(--label3); letter-spacing:0.4px; font-size:14.5px; font-family:-apple-system, 'IBM Plex Sans Arabic', sans-serif;}

  .send-btn{
    display:flex; align-items:center; justify-content:center;
    width:54px; height:54px; flex-shrink:0;
    background:var(--accent); color:#fff;
    border:none; border-radius:50%;
    cursor:pointer;
    transition:transform .12s, background .15s, opacity .15s;
  }
  .send-btn:active{transform:scale(0.90); background:var(--accent-bright);}
  .send-btn:focus-visible{outline:2px solid var(--accent-bright); outline-offset:3px;}

  .live-match{
    margin:14px 2px 2px; min-height:20px;
    font-size:13.5px; color:var(--label2);
    display:flex; align-items:center; gap:6px;
  }
  .live-match .status-icon{display:flex; flex-shrink:0;}
  .live-match .status-icon.ok{color:var(--success);}
  .live-match .status-icon.bad{color:var(--danger);}
  .live-match b{color:var(--label); font-weight:600;}
  .live-match.notfound{color:var(--label2);}

  /* Results list, grouped table row style */
  .results-list{
    margin-top:12px;
    display:flex;
    flex-direction:column;
    max-height:340px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    border-radius:14px;
    background:var(--card2);
  }
  .results-list:empty{margin-top:0;}
  .result-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    min-height:48px;
    cursor:pointer;
    text-align:right;
    border-bottom:1px solid var(--sep);
    transition:background .12s;
  }
  .result-item:last-child{border-bottom:none;}
  .result-item:active{background:var(--card3);}
  .result-item .r-icon{
    display:flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:9px; flex-shrink:0;
    background:var(--accent-dim); color:var(--accent-bright);
  }
  .result-item .r-name{font-size:14.5px; font-weight:500; color:var(--label); flex:1;}
  .result-item .r-arrow{color:var(--label3); flex-shrink:0; display:flex;}

  /* Filter chips, iOS capsule style */
  .chips{
    display:flex; gap:9px; flex-wrap:wrap; margin-top:16px;
  }
  .chip{
    display:flex; align-items:center; gap:6px;
    font-size:13px; font-weight:500; color:var(--label2);
    background:var(--card); border:none;
    padding:9px 15px; border-radius:100px;
    cursor:pointer; white-space:nowrap;
    transition:background .12s, color .12s, transform .1s;
  }
  .chip svg{flex-shrink:0;}
  .chip:active{transform:scale(0.95); background:var(--card2);}

  .toast{
    position:fixed; bottom:calc(26px + var(--safe-bottom)); left:50%; transform:translateX(-50%);
    background:rgba(28,28,30,0.78);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,0.08);
    color:var(--label);
    padding:12px 22px; border-radius:100px; font-size:13.5px; font-weight:500;
    box-shadow:0 12px 32px rgba(0,0,0,0.5);
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    z-index:50;
    max-width:88vw;
    text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .suggest-card{
    display:flex; align-items:center; gap:12px;
    background:var(--card);
    border-radius:16px;
    padding:14px 16px;
    margin-top:16px;
    text-decoration:none;
    box-shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 10px 24px rgba(0,0,0,0.35);

    background:var(--accent-dim); color:var(--accent-bright);
  }
  .suggest-text{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0;}
  .suggest-title{font-size:13.5px; font-weight:600; color:var(--label);}
  .suggest-sub{font-size:12px; color:var(--label2);}
  .suggest-arrow{color:var(--label3); flex-shrink:0; display:flex;}

    text-align:center;

    color:var(--label3);
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;

  }

  @media (max-width:420px){

    #codeInput{font-size:19px;}
    .send-btn{width:48px; height:48px;}
  }
  @media (max-width:340px){
    .code-row{flex-wrap:wrap;}
    #codeInput{width:100%;}
    .send-btn{width:100%; height:48px; border-radius:14px;}
  }
</style>

function loadData(){
  // المصدر الوحيد لبيانات المواقع هو ملف الاكسل، يتحدث يدويا كل ما تنحدث القائمة
  locations = DEFAULT_LOCATIONS.slice();
  embassies = DEFAULT_EMBASSIES.slice();
  updateCount();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function updateCount(){
  const total = locations.length + embassies.length;
  document.getElementById('countBadge').textContent = total + (total===1?' موقع':' مواقع');
}

function resolveUrl(raw){
  if(!raw) return null;
  raw = raw.toString().trim();
  if(raw.startsWith('http')) return raw;
  // lat,lng pattern
  const m = raw.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
  if(m) return `https://www.google.com/maps?q=${m[1]},${m[2]}`;
  // treat as a place search
  return `https://www.google.com/maps/search/${encodeURIComponent(raw)}`;
}

function findByNumber(num){
  return locations.find(l => l.number.toString() === num.toString().trim());
}

// تطبيع النص العربي عشان البحث يشتغل حتى لو اختلف رسم الهمزة أو التاء المربوطة
function normalizeAr(s){
  return s.toString()
    .trim()
    .replace(/[إأآا]/g, 'ا')
    .replace(/ة/g, 'ه')
    .replace(/ى/g, 'ي')
    .replace(/\s+/g, ' ')
    .toLowerCase();
}

function searchEmbassies(query){
  const q = normalizeAr(query);
  if(!q) return [];
  return embassies.filter(e => normalizeAr(e.name).includes(q));
}

// مواقع رقمها مش رقم صرف (متل Service Apartment 8)، منردها كنتائج نصية زي السفارات
function searchNonNumericLocations(query){
  const q = normalizeAr(query);
  if(!q) return [];
  return locations
    .filter(l => !/^\d+$/.test(l.number) && normalizeAr(l.number).includes(q))
    .map(l => ({name: l.number, link: l.link}));
}

function searchTextAll(query){
  return [...searchEmbassies(query), ...searchNonNumericLocations(query)];
}

function isNumericQuery(q){
  return /^\d+$/.test(q.trim());
}

function openLocation(loc){
  if(!loc) return;
  window.open(resolveUrl(loc.link), '_blank');
}

function renderResultsList(items){
  const list = document.getElementById('resultsList');
  list.innerHTML = '';
  items.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'result-item';
    const icon = item.name.includes('سفارة') || item.name.includes('بعثة') ? ICONS.building : ICONS.pin;
    row.innerHTML = `<span class="r-icon">${icon}</span><span class="r-name">${item.name}</span><span class="r-arrow">${ICONS.chevron}</span>`;
    row.addEventListener('click', ()=> openLocation(item));
    list.appendChild(row);
  });
}

// --- Console input ---
const codeInput = document.getElementById('codeInput');
const liveMatch = document.getElementById('liveMatch');
const resultsList = document.getElementById('resultsList');

function handleInput(){
  const val = codeInput.value.trim();
  liveMatch.classList.remove('notfound');
  resultsList.innerHTML = '';

  if(!val){
    liveMatch.innerHTML='';
    return;
  }

  if(isNumericQuery(val)){
    const found = findByNumber(val);
    if(found){
      liveMatch.innerHTML = `<span class="status-icon ok">${ICONS.check}</span> الموقع <b>${found.number}</b> موجود، دوس فتح`;
    }else{
      liveMatch.classList.add('notfound');
      liveMatch.innerHTML = `<span class="status-icon bad">${ICONS.xmark}</span> ما في موقع بهيك رقم`;
    }
    return;
  }

  // بحث نصي عن سفارة أو موقع رقمه مش صرف
  const matches = searchTextAll(val);
  if(matches.length === 0){
    liveMatch.classList.add('notfound');
    liveMatch.innerHTML = `<span class="status-icon bad">${ICONS.xmark}</span> ما في نتائج، جرب اكتب "سفاره"`;
  }else if(matches.length === 1){
    liveMatch.innerHTML = `<span class="status-icon ok">${ICONS.check}</span> لقيت <b>${matches[0].name}</b>، دوس فتح`;
    renderResultsList(matches);
  }else{
    liveMatch.innerHTML = `🔎 لقيت ${matches.length} نتيجة، اختار وحدة من تحت`;
    renderResultsList(matches);
  }
}

codeInput.addEventListener('input', handleInput);

codeInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('goBtn').click();
});

document.getElementById('goBtn').addEventListener('click', ()=>{
  const val = codeInput.value.trim();
  if(!val){ showToast('دخّل رقم الموقع أو اسم السفارة الأول'); return; }

  if(isNumericQuery(val)){
    const found = findByNumber(val);
    if(found){ openLocation(found); }
    else{ showToast('ما لقيت موقع بهالرقم'); }
    return;
  }

  const matches = searchTextAll(val);
  if(matches.length === 1){
    openLocation(matches[0]);
  }else if(matches.length > 1){
    showToast('في أكتر من نتيجة، اختار وحدة من القائمة تحت');
  }else{
    showToast('ما لقيت نتيجة بهالاسم');
  }
});

document.getElementById('chipEmbassies').addEventListener('click', ()=>{
  codeInput.value = 'سفاره';
  handleInput();
  codeInput.focus();
});

loadData();

// تسجيل service worker عشان يشتغل كتطبيق PWA (offline + بدون شريط المتصفح)
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
