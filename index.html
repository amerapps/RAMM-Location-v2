<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

  :root{
    --bg:#17181A;
    --panel:#202124;
    --panel2:#27282C;
    --panel3:#2C2D31;
    --line:#37383D;
    --line-bright:#4A4B51;
    --text:#EDEDEE;
    --muted:#8D8E93;
    --orange:#D9622B;
    --orange-bright:#F2874A;
    --orange-dim:#7A3A18;
    --danger:#E5484D;
    --ok:#7CB88A;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html, body{overflow-x:hidden; width:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 10% -10%, rgba(217,98,43,0.10), transparent 45%),
      radial-gradient(ellipse at 100% 110%, rgba(217,98,43,0.06), transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:'Rubik', sans-serif;
    min-height:100vh;
    min-height:100dvh;
    padding:calc(20px + var(--safe-top)) 14px calc(30px + var(--safe-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px; margin:0 auto;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
    gap:10px;
  }
  header .title{
    font-family:'Oswald', sans-serif;
    font-weight:700; font-size:20px; letter-spacing:0.3px;
    text-transform:uppercase;
  }
  header .title span{color:var(--orange);}
  header .sub{color:var(--muted); font-size:11.5px; margin-top:3px;}
  .count-badge{
    font-family:'IBM Plex Mono', monospace;
    background:var(--panel2); border:1px solid var(--line);
    color:var(--orange-bright); font-size:11.5px; padding:6px 10px; border-radius:4px;
    white-space:nowrap;
    flex-shrink:0;
  }

  /* Dispatch console */
  .console{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    box-shadow:0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.02);
    position:relative;
    overflow:hidden;
  }
  .console::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:5px;
    background:repeating-linear-gradient(-45deg, var(--orange) 0 10px, #1A1A1C 10px 20px);
    opacity:0.85;
  }
  .console-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--muted); letter-spacing:1.5px; margin:8px 0 12px;
    display:flex; align-items:center; gap:7px; text-transform:uppercase;
  }
  .console-label .dot{width:6px; height:6px; border-radius:50%; background:var(--orange); box-shadow:0 0 8px rgba(217,98,43,0.7);}

  .code-row{display:flex; gap:9px; align-items:center;}
  #codeInput{
    flex:1;
    min-width:0;
    font-family:'IBM Plex Mono', monospace;
    font-size:24px; font-weight:600;
    background:#101113;
    border:1px solid var(--line-bright);
    border-radius:8px;
    color:var(--orange-bright);
    text-align:center;
    padding:14px 8px;
    letter-spacing:2px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
    -webkit-appearance:none;
  }
  #codeInput:focus{border-color:var(--orange); box-shadow:0 0 0 3px rgba(217,98,43,0.15);}
  #codeInput::placeholder{color:#4A4B51; letter-spacing:1px; font-size:15px;}

  .go-btn{
    font-family:'Oswald', sans-serif;
    font-weight:600; font-size:13.5px; letter-spacing:0.5px; text-transform:uppercase;
    background:var(--orange); color:#1A1200;
    border:none; border-radius:8px;
    padding:0 18px; height:56px;
    cursor:pointer;
    transition:transform .1s, background .15s;
    white-space:nowrap;
    flex-shrink:0;
  }
  .go-btn:active{transform:scale(0.96);}
  .go-btn:hover{background:var(--orange-bright);}

  .live-match{
    margin-top:12px; min-height:20px;
    font-size:13px; color:var(--muted);
  }
  .live-match b{color:var(--ok); font-weight:600;}
  .live-match.notfound{color:var(--danger);}

  /* Results list (embassy matches) */
  .results-list{
    margin-top:10px;
    display:flex;
    flex-direction:column;
    gap:7px;
    max-height:340px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .result-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--panel3);
    border:1px solid var(--line);
    border-radius:8px;
    padding:13px 14px;
    min-height:48px;
    cursor:pointer;
    text-align:right;
    transition:background .12s, border-color .12s, transform .08s;
  }
  .result-item:active{transform:scale(0.98); background:var(--panel2);}
  .result-item:hover{border-color:var(--orange-dim); background:var(--panel2);}
  .result-item .r-name{font-size:14.5px; font-weight:500; color:var(--text);}
  .result-item .r-arrow{color:var(--orange); font-size:16px; flex-shrink:0;}

  /* Quick category chips */
  .chips{
    display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;
  }
  .chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px; color:var(--muted);
    background:var(--panel2); border:1px solid var(--line);
    padding:7px 12px; border-radius:20px;
    cursor:pointer; white-space:nowrap;
    transition:border-color .12s, color .12s;
  }
  .chip:active{transform:scale(0.96);}
  .chip.active{color:var(--orange-bright); border-color:var(--orange-dim);}

  .toast{
    position:fixed; bottom:calc(24px + var(--safe-bottom)); left:50%; transform:translateX(-50%);
    background:var(--panel2); border:1px solid var(--orange-dim); color:var(--text);
    padding:11px 20px; border-radius:8px; font-size:13.5px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    z-index:50;
    max-width:88vw;
    text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  footer{
    text-align:center;
    margin-top:26px;
    color:#5A5B60;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.4px;
  }

  /* Mobile tightening */
  @media (max-width:420px){
    body{padding:calc(16px + var(--safe-top)) 10px calc(24px + var(--safe-bottom));}
    header .title{font-size:17px;}
    .console{padding:14px;}
    #codeInput{font-size:20px; letter-spacing:1px;}
    .go-btn{padding:0 14px; font-size:12.5px;}
  }
  @media (max-width:360px){
    .code-row{flex-wrap:wrap;}
    #codeInput{width:100%; font-size:22px;}
    .go-btn{height:50px; width:100%;}
  }
</style>
</head>

function loadData(){
  // المصدر الوحيد لبيانات المواقع هو ملف الاكسل، يتحدث يدويا كل ما تنحدث القائمة
  locations = DEFAULT_LOCATIONS.slice();
  embassies = DEFAULT_EMBASSIES.slice();
  updateCount();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function updateCount(){
  const total = locations.length + embassies.length;
  document.getElementById('countBadge').textContent = total + (total===1?' موقع':' مواقع');
}

function resolveUrl(raw){
  if(!raw) return null;
  raw = raw.toString().trim();
  if(raw.startsWith('http')) return raw;
  // lat,lng pattern
  const m = raw.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
  if(m) return `https://www.google.com/maps?q=${m[1]},${m[2]}`;
  // treat as a place search
  return `https://www.google.com/maps/search/${encodeURIComponent(raw)}`;
}

function findByNumber(num){
  return locations.find(l => l.number.toString() === num.toString().trim());
}

// تطبيع النص العربي عشان البحث يشتغل حتى لو اختلف رسم الهمزة أو التاء المربوطة
function normalizeAr(s){
  return s.toString()
    .trim()
    .replace(/[إأآا]/g, 'ا')
    .replace(/ة/g, 'ه')
    .replace(/ى/g, 'ي')
    .replace(/\s+/g, ' ')
    .toLowerCase();
}

function searchEmbassies(query){
  const q = normalizeAr(query);
  if(!q) return [];
  return embassies.filter(e => normalizeAr(e.name).includes(q));
}

// مواقع رقمها مش رقم صرف (متل Service Apartment 8)، منردها كنتائج نصية زي السفارات
function searchNonNumericLocations(query){
  const q = normalizeAr(query);
  if(!q) return [];
  return locations
    .filter(l => !/^\d+$/.test(l.number) && normalizeAr(l.number).includes(q))
    .map(l => ({name: l.number, link: l.link}));
}

function searchTextAll(query){
  return [...searchEmbassies(query), ...searchNonNumericLocations(query)];
}

function isNumericQuery(q){
  return /^\d+$/.test(q.trim());
}

function openLocation(loc){
  if(!loc) return;
  window.open(resolveUrl(loc.link), '_blank');
}

function renderResultsList(items){
  const list = document.getElementById('resultsList');
  list.innerHTML = '';
  items.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'result-item';
    row.innerHTML = `<span class="r-name">${item.name}</span><span class="r-arrow">‹</span>`;
    row.addEventListener('click', ()=> openLocation(item));
    list.appendChild(row);
  });
}

// --- Console input ---
const codeInput = document.getElementById('codeInput');
const liveMatch = document.getElementById('liveMatch');
const resultsList = document.getElementById('resultsList');

function handleInput(){
  const val = codeInput.value.trim();
  liveMatch.classList.remove('notfound');
  resultsList.innerHTML = '';

  if(!val){
    liveMatch.textContent='';
    return;
  }

  if(isNumericQuery(val)){
    const found = findByNumber(val);
    if(found){
      liveMatch.innerHTML = `✅ الموقع <b>${found.number}</b> موجود، دوس فتح`;
    }else{
      liveMatch.classList.add('notfound');
      liveMatch.textContent = '❌ ما في موقع بهيك رقم';
    }
    return;
  }

  // بحث نصي عن سفارة أو موقع رقمه مش صرف
  const matches = searchTextAll(val);
  if(matches.length === 0){
    liveMatch.classList.add('notfound');
    liveMatch.textContent = '❌ ما في نتائج، جرب اكتب "سفاره"';
  }else if(matches.length === 1){
    liveMatch.innerHTML = `✅ لقيت <b>${matches[0].name}</b>، دوس فتح`;
    renderResultsList(matches);
  }else{
    liveMatch.textContent = `🔎 لقيت ${matches.length} نتيجة، اختار وحدة من تحت`;
    renderResultsList(matches);
  }
}

codeInput.addEventListener('input', handleInput);

codeInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('goBtn').click();
});

document.getElementById('goBtn').addEventListener('click', ()=>{
  const val = codeInput.value.trim();
  if(!val){ showToast('دخّل رقم الموقع أو اسم السفارة الأول'); return; }

  if(isNumericQuery(val)){
    const found = findByNumber(val);
    if(found){ openLocation(found); }
    else{ showToast('ما لقيت موقع بهالرقم'); }
    return;
  }

  const matches = searchTextAll(val);
  if(matches.length === 1){
    openLocation(matches[0]);
  }else if(matches.length > 1){
    showToast('في أكتر من نتيجة، اختار وحدة من القائمة تحت');
  }else{
    showToast('ما لقيت نتيجة بهالاسم');
  }
});

document.getElementById('chipEmbassies').addEventListener('click', ()=>{
  codeInput.value = 'سفاره';
  handleInput();
  codeInput.focus();
});

document.getElementById('chipClear').addEventListener('click', ()=>{
  codeInput.value = '';
  handleInput();
  codeInput.focus();
});

loadData();

// تسجيل service worker عشان يشتغل كتطبيق PWA (offline + بدون شريط المتصفح)
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
